name: EarnBetter
description: >-
  EarnBetter is a consumer job-search platform that gives workers free
  AI-powered tools to land better work, including an AI resume builder, cover
  letter generator, personalized job matching across more than five million
  listings, and a job-search tracker. The service is positioned as 100% free to
  job seekers and was acquired by EarnIn, the earned-wage / payroll-access
  company. EarnBetter surfaces as a portfolio company of a16z and was added to
  the API Evangelist network as a lead. As of this pass EarnBetter publishes no
  public developer portal, API documentation, or machine-readable API surface;
  this profile therefore captures company identity and public link properties
  only, with no API artifacts to enrich.
